# Loaded only by the test Compose overlay; no URI, query, body, IP or token.
map $uri $auzef_load_is_widget_chat {
    default 0;
    /widget-chat 1;
}
log_format auzef_load escape=json '{"kind":"AUZEF_LOAD_NGINX","time":"$time_iso8601",'
    '"request_id":"$http_x_auzef_load_request_id","status":$status,'
    '"widget_chat":$auzef_load_is_widget_chat,'
    '"request_time":"$request_time","upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr"}';
access_log /dev/stdout auzef_load;
