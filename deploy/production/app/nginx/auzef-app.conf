# Native APP node HTTP listener. TLS termination is intentionally not defined
# until the physical Load Balancer contract is confirmed.

limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sc_sms_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=integration_api_limit:10m rate=10r/s;

server {
    # Default APP listener; coordinate any port change with the physical LB.
    listen 80 default_server;
    server_name 127.0.0.1 localhost _;

    root /opt/auzef/current/frontend;
    index index.html;
    client_max_body_size 10m;

    # Add one or more institution-provided trusted LB networks here. Until
    # then Nginx deliberately treats the LB address as the client address.
    # set_real_ip_from <BIDB_TRUSTED_LB_CIDR>;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /widget-chat {
        if (-f /var/lib/auzef/flags/maintenance.flag) {
            return 503;
        }

        error_page 502 503 504 = @maintenance;
        limit_req zone=chat_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000/widget-chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location @maintenance {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 300 always;
        return 503 '{"detail":"maintenance"}';
    }

    location = /api/auth/login {
        limit_req zone=admin_login_limit burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @admin_login_limited;

        proxy_pass http://127.0.0.1:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @admin_login_limited {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Çok fazla başarısız deneme. Lütfen birkaç dakika sonra tekrar deneyin."}';
    }

    location = /api/solution-center/send-sms {
        limit_req zone=sc_sms_limit burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @sc_limited;

        proxy_pass http://127.0.0.1:8000/api/solution-center/send-sms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @sc_limited {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Çok fazla doğrulama isteği gönderildi. Lütfen bir süre bekleyip tekrar deneyin."}';
    }

    location = /api/search {
        limit_req zone=chat_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000/api/search;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/integrations/v1/ {
        limit_req zone=integration_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    location = /widget.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
