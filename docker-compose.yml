version: '3.8'

services:

  # ─── 1. PostgreSQL ─────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: auzef_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-auzef_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-auzef_bot}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. pgAdmin ────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: auzef_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # ─── 3. MeiliSearch ────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: auzef_meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      disable: true
  # ─── 4. Qdrant ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: auzef_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:6333/healthz | grep -q 'ok'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 5. FastAPI Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auzef_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container içinde servis adları kullanılır, localhost değil
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-auzef_bot}
      MEILI_URL: http://meilisearch:7700
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    ports:
      - "8000:8000"
    volumes:
      # sentence-transformers model cache — her rebuild'de yeniden indirme önlenir
      - hf_cache:/app/.cache/huggingface
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8000/api/config/llm || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── 6. Angular Frontend (nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./chatbot-web
      dockerfile: Dockerfile
    container_name: auzef_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  meili_data:
  qdrant_data:
  hf_cache:
