# ── Rate limit bölgesi (http context'inde tanımlanmalı; conf.d http içindedir) ──
# Amaç: tek bir IP'nin sohbet ucunu makineyle taramasını / LLM bütçesini
# eritmesini engellemek. Kampüs NAT'ı arkasında yüzlerce öğrenci tek IP'den
# gelebileceği için oran bilinçli olarak yüksek tutuldu (10 istek/sn + 30 patlama).
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;

# ── HTTP → HTTPS yönlendirmesi ──────────────────────────
server {
    listen 80;
    server_name auzefasistan.istanbul.edu.tr;
    return 301 https://$host$request_uri;
}

# ── HTTPS sunucusu ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name auzefasistan.istanbul.edu.tr;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Varsayılan (1m) elle-seçim export'unda (POST {ids}) ya da belge
    # yüklemede 413'e çarpabilir. Asıl "tümünü seç" export'u artık id listesi
    # göndermiyor (bkz. conversations.py export_conversations ?search= notu);
    # bu, geri kalan (küçük ama sınırsız) POST body'leri için güvenlik payı.
    client_max_body_size 10m;

    # ── Health endpoint (izleme/doğrulama) ───────────────
    # Bu location olmazsa /health SPA catch-all'ına düşer ve index.html döner.
    location = /health {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;   # izleme sistemlerinin sık ping'i logları şişirmesin
    }

    # ── Widget chat endpoint ─────────────────────────────
    location = /widget-chat {
        # Bakım bayrağı: panel butonu (backend /api/settings/maintenance) ya da
        # bakim.sh bu dosyayı ops_flags volume'una yazar. Dosya varken
        # widget 503 alır; admin paneli ve /api/ etkilenmez.
        if (-f /etc/nginx/flags/maintenance.flag) { return 503; }
        # Backend'e ulaşılamıyorsa (çökme, deploy'daki model yüklemesi) öğrenci
        # nginx'in çıplak 502'si yerine aynı bakım yanıtını görür — otomatik,
        # kimsenin bakım modunu "açması" gerekmez.
        error_page 502 503 504 = @maintenance;
        # Rate limit 503 dönmesin — bakım yanıtıyla karışırdı (widget 503'ü
        # "bakımdayız" mesajına çevirir). 429 = genel "tekrar deneyin" mesajı.
        limit_req_status   429;
        limit_req          zone=chat_limit burst=30 nodelay;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Bakım yanıtı (widget.js 503'ü bakım mesajına çevirir) ──
    location @maintenance {
        default_type application/json;
        add_header   Cache-Control "no-store" always;
        add_header   Retry-After "300" always;
        return 503 '{"detail":"maintenance"}';
    }

    # ── Admin login: parola deneme saldırısına karşı sıkı rate limit ────
    # (exact match location, regex bloklarından önce değerlendirilir)
    location = /api/auth/login {
        limit_req          zone=chat_limit burst=10 nodelay;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # NOT: Buradaki geçici Basic Auth kalkanı kaldırıldı — yönetim uçlarını
    # artık backend'in oturum sistemi koruyor (auth.py, ADMIN_AUTH_ENFORCED
    # varsayılan true; E2E doğrulandı). Widget uçları backend'de zaten public.

    # ── API isteklerini backend'e proxy et ──────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── index.html ASLA cache'lenmesin (SPA giriş noktası) ──
    # JS/CSS içerik-hash'li olduğu için uzun cache'lenir; ama index.html güncel
    # hash'lere işaret ettiğinden her ziyarette doğrulanmalı. Aksi halde tarayıcı
    # eski index.html'i (eski chunk'ları) gösterir ve deploy'lar CTRL+SHIFT+R
    # gerektirir. "no-cache" = önbelleğe alınabilir ama kullanmadan önce doğrula.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # NOT (nginx tuzağı): bu blokta add_header olduğundan server seviyesindeki
        # güvenlik başlıkları MİRAS ALINMAZ; burada tekrar tanımlıyoruz.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── widget.js: SABİT isimli ama İÇERİĞİ DEĞİŞEN embed script ──
    # Angular chunk'ları içerik-hash'li olduğundan aşağıdaki (js|css|…) bloğunun
    # `immutable` 1 yıl cache'i onlar için güvenli. Ama widget.js her zaman
    # /widget.js adıyla servis edilir (adı değişmez, içeriği değişir); o blok onu
    # da 1 yıl `immutable` cache'liyordu → tarayıcı yeni widget UI'ını ASLA
    # çekmiyor, eski görünüm kalıcı oluyordu. Exact-match location regex'ten önce
    # değerlendirilir; burada index.html gibi her ziyarette doğrulamaya zorlarız.
    location = /widget.js {
        add_header Cache-Control "no-cache" always;
        # add_header kullanıldığı an server seviyesindeki güvenlik başlıkları
        # MİRAS ALINMAZ (index.html bloğundaki tuzağın aynısı) — tekrar tanımla.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Angular SPA routing (tüm sayfalar index.html'e) ─
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statik dosyalar için cache ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Güvenlik başlıkları ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
