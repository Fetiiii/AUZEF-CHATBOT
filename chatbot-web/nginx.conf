# ── Rate limit bölgesi (http context'inde tanımlanmalı; conf.d http içindedir) ──
# Amaç: tek bir IP'nin sohbet ucunu makineyle taramasını / LLM bütçesini
# eritmesini engellemek. Kampüs NAT'ı arkasında yüzlerce öğrenci tek IP'den
# gelebileceği için oran bilinçli olarak yüksek tutuldu (10 istek/sn + 30 patlama).
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;

# ── HTTP → HTTPS yönlendirmesi ──────────────────────────
server {
    listen 80;
    server_name auzefasistan.istanbul.edu.tr;
    return 301 https://$host$request_uri;
}

# ── HTTPS sunucusu ───────────────────────────────────────
server {
    listen 443 ssl;
    server_name auzefasistan.istanbul.edu.tr;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # ── Widget chat endpoint ─────────────────────────────
    location = /widget-chat {
        limit_req          zone=chat_limit burst=30 nodelay;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Widget'ın kullandığı PUBLIC api uçları ───────────
    # DİKKAT: regex location'lar sıra ile değerlendirilir; bu blok admin
    # kalkanından ÖNCE gelmeli ki öğrencinin talep yanıtı auth'a takılmasın.
    # (/api/messages/{id}/rating regex'lere hiç takılmaz, /api/ prefix'inden geçer.)
    location ~ ^/api/conversations/\d+/talep$ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── GEÇİCİ ADMİN KALKANI (gerçek kullanıcı sistemi gelene kadar) ─────
    # QnA/takvim CRUD'u, konuşma transkriptleri, istatistik ve LLM ayarı gibi
    # yönetim uçları Basic Auth arkasında. htpasswd dosyası docker-compose ile
    # ./ssl/htpasswd'den mount edilir; dosya yoksa uçlar kilitli kalır (fail-closed).
    # Kullanıcı sistemi devreye girince bu blok kaldırılabilir.
    location ~ ^/api/(qna|conversations|config|stats|academic-calendar) {
        auth_basic           "AUZEF Yonetim";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── API isteklerini backend'e proxy et ──────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── index.html ASLA cache'lenmesin (SPA giriş noktası) ──
    # JS/CSS içerik-hash'li olduğu için uzun cache'lenir; ama index.html güncel
    # hash'lere işaret ettiğinden her ziyarette doğrulanmalı. Aksi halde tarayıcı
    # eski index.html'i (eski chunk'ları) gösterir ve deploy'lar CTRL+SHIFT+R
    # gerektirir. "no-cache" = önbelleğe alınabilir ama kullanmadan önce doğrula.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # NOT (nginx tuzağı): bu blokta add_header olduğundan server seviyesindeki
        # güvenlik başlıkları MİRAS ALINMAZ; burada tekrar tanımlıyoruz.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ── Angular SPA routing (tüm sayfalar index.html'e) ─
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statik dosyalar için cache ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Güvenlik başlıkları ──────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
