server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Health endpoint (izleme/doğrulama) ───────────────
    location = /health {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Widget chat endpoint ─────────────────────────────
    location = /widget-chat {
        # Bakım bayrağı + otomatik 502→bakım yanıtı (production conf'un aynısı)
        if (-f /etc/nginx/flags/maintenance.flag) { return 503; }
        error_page 502 503 504 = @maintenance;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── Bakım yanıtı (widget.js 503'ü bakım mesajına çevirir) ──
    location @maintenance {
        default_type application/json;
        add_header   Cache-Control "no-store" always;
        add_header   Retry-After "300" always;
        return 503 '{"detail":"maintenance"}';
    }

    # ── API isteklerini backend'e proxy et ──────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── index.html ASLA cache'lenmesin (production conf'taki tuzağın aynısı):
    # aksi halde tarayıcı eski index.html + eski hash'li chunk'ları 1 yıl
    # cache'ler ve her yeni image'da CTRL+SHIFT+R gerekir.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ── widget.js: sabit isimli, içeriği değişen embed script ──
    # (js|css|…) bloğu 1 yıl `immutable` cache'liyor; widget.js hep aynı adla
    # geldiği için yeni UI tarayıcıya ulaşmıyordu. Exact-match ile doğrulat
    # (production nginx.conf'taki aynı düzeltmenin dev karşılığı).
    location = /widget.js {
        add_header Cache-Control "no-cache" always;
    }

    # ── Angular SPA routing ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Statik dosyalar için cache ───────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
