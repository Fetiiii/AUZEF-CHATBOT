<header class="fixed top-0 right-0 left-0 h-[var(--header-h)] header-surface flex items-center z-30 transition-[left]"
    [style.left]="offsetLeft">
    <div class="flex-1 px-3 lg:px-6 flex items-center gap-3">
        <!-- Sidebar toggle -->
        <button type="button" (click)="onToggleSidebar()"
            class="hidden lg:inline-flex items-center justify-center rounded-lg p-2 hover:bg-gray-100 dark:hover:bg-slate-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <!-- Sayfa başlığı -->
        <div class="font-semibold text-slate-900 dark:text-white whitespace-nowrap overflow-hidden text-ellipsis">
            {{ pageTitle() }}
        </div>

        <div class="ml-auto flex items-center gap-2">
            <!-- Tema -->
            <div class="hidden md:inline-flex items-center gap-2">
                <div class="segment">
                    <button type="button" [attr.aria-pressed]="theme.mode()==='system'" (click)="setTheme('system')"
                        title="{{ i18n.t('theme.system') }}">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" />
                        </svg>
                    </button>
                    <button type="button" [attr.aria-pressed]="theme.mode()==='light'" (click)="setTheme('light')"
                        title="{{ i18n.t('theme.light') }}">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path
                                d="M12 18a6 6 0 1 0-6-6 6 6 0 0 0 6 6Zm0-14v2M12 18v2m8-8h-2M6 12H4m12.95 4.95-1.41-1.41M8.46 8.46 7.05 7.05m9.9 9.9 1.41 1.41M8.46 15.54 7.05 16.95" />
                        </svg>
                    </button>
                    <button type="button" [attr.aria-pressed]="theme.mode()==='dark'" (click)="setTheme('dark')"
                        title="{{ i18n.t('theme.dark') }}">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3c.06 0 .12 0 .18 0A7 7 0 0 0 21 12.79Z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Dil -->
            <div class="relative">
                <button type="button" class="langbtn" (click)="toggleLangMenu()">
                    <img [src]="currentFlag()" class="flag" alt="flag" />
                    <span class="hidden sm:inline">{{ i18n.lang() | uppercase }}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </button>

                <div *ngIf="langOpen"
                    class="absolute right-0 mt-1 w-32 rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg overflow-hidden z-40">
                    <button class="w-full flex items-center gap-2 px-3 py-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                        (click)="setLang('tr')">
                        <img src="assets/flags/tr.svg" class="flag" alt="TR" />
                        Türkçe
                    </button>
                    <button class="w-full flex items-center gap-2 px-3 py-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                        (click)="setLang('en')">
                        <img src="assets/flags/en.svg" class="flag" alt="EN" />
                        English
                    </button>
                </div>
            </div>



            <!-- Kullanıcı menüsü -->
            <div class="relative">
                <button type="button"
                    class="flex items-center gap-2 h-9 rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 hover:bg-gray-100 dark:hover:bg-slate-800"
                    (click)="toggleUserMenu()">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg text-[11px] font-medium border"
                        [ngClass]="
              userStatus === 'available'
                ? 'border-emerald-500/60 bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300'
                : 'border-amber-500/60 bg-amber-50 text-amber-700 dark:bg-amber-950/40 dark:text-amber-300'
            ">
                        <span class="h-2 w-2 rounded-lg"
                            [ngClass]="userStatus === 'available' ? 'bg-emerald-500' : 'bg-amber-400'"></span>
                        {{ statusLabel() }}
                    </span>

                    <span class="text-sm font-semibold text-slate-900 dark:text-slate-100 max-w-[150px] truncate">
                        {{ userName }}
                    </span>

                    <svg class="h-4 w-4 opacity-70" viewBox="0 0 20 20" fill="none" stroke="currentColor">
                        <path d="M5.25 7.5l4.75 5 4.75-5" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                    </svg>
                </button>

                <!-- Kullanıcı menü paneli -->
                <div *ngIf="userMenuOpen"
                    class="absolute right-0 mt-1 w-56 rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-lg z-40">
                    <!-- ÜST PROFİL BAŞLIĞI -->
                    <div class="flex items-center justify-between px-3 py-2
                   border-b border-gray-200 dark:border-slate-700
                   bg-slate-50/80 dark:bg-slate-900/80">
                        <div class="flex items-center gap-2">
                            <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg
                       bg-violet-50 dark:bg-violet-500/15
                       text-violet-600 dark:text-violet-300
                       border border-violet-200 dark:border-violet-500/40">
                                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.6">
                                    <path d="M12 12a3 3 0 1 0-3-3 3 3 0 0 0 3 3Z" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <path d="M6 18c0-2.21 2.69-4 6-4s6 1.79 6 4" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </span>
                            <span class="text-sm font-semibold text-slate-900 dark:text-slate-100">
                                {{ userName }}
                            </span>
                        </div>
                        <button type="button" class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800"
                            (click)="closeUserMenu()">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.6">
                                <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>

                    <div class="py-1 text-sm">
                        <!-- <button
                            class="w-full px-3 py-2 flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                            (click)="setUserStatus('available')">
                            <span class="h-2.5 w-2.5 rounded-lg bg-green-500"></span>
                            <span>{{ i18n.t('user.available') }}</span>
                        </button>
                        <button
                            class="w-full px-3 py-2 flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                            (click)="setUserStatus('away')">
                            <span class="h-2.5 w-2.5 rounded-lg bg-yellow-500"></span>
                            <span>{{ i18n.t('user.away') }}</span>
                        </button> -->

                        <!-- <div class="my-1 h-px bg-gray-200 dark:bg-slate-700"></div>

                        <button
                            class="w-full px-3 py-2 flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                            (click)="openProfile()">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.6">
                                <path d="M12 12a3 3 0 1 0-3-3 3 3 0 0 0 3 3Z" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M6 18c0-2.21 2.69-4 6-4s6 1.79 6 4" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                            <span>{{ i18n.t('nav.profile') }}</span>
                        </button> -->
                        <!-- 
                        <button
                            class="w-full px-3 py-2 flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                            (click)="openPreparedMessages()">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M8.25 9.75h7.5m-7.5 3h4.5M4.5 20.25 6.75 18h10.5A2.25 2.25 0 0 0 19.5 15.75V6A2.25 2.25 0 0 0 17.25 3.75H6.75A2.25 2.25 0 0 0 4.5 6v14.25Z" />
                            </svg>
                            <span>{{ i18n.t('nav.prepared-messages') }}</span>
                        </button> -->

                        <!-- <button
                            class="w-full px-3 py-2 flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-slate-800"
                            (click)="changePassword()">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor">
                                <path
                                    d="M12 17a2 2 0 100-4 2 2 0 000 4zm6-6V9a6 6 0 10-12 0v2H4v10h16V11h-2zm-8 0V9a4 4 0 018 0v2H10z" />
                            </svg>
                            <span>{{ i18n.t('user.changePassword') }}</span>
                        </button> -->

                        <button
                            class="w-full px-3 py-2 flex items-center gap-2 hover:bg-gray-100 dark:hover:bg-slate-800 text-red-600"
                            (click)="logout()">
                            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M15 12H3m12 0l-3-3m3 3l-3 3M21 5v14a2 2 0 01-2 2h-6" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <span>{{ i18n.t('header.logout') }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BİLDİRİM PANELİ -->
    <div *ngIf="notificationPanelOpen" class="fixed inset-0 z-40 pointer-events-none">
        <section class="absolute top-[calc(var(--header-h)+8px)] right-4
                 w-[min(360px,calc(100%-32px))]
                 rounded-lg border border-gray-200/80 dark:border-white/10
                 bg-white/95 dark:bg-slate-900/95 backdrop-blur
                 shadow-xl shadow-slate-900/30
                 flex flex-col overflow-hidden pointer-events-auto">
            <!-- Panel üst -->
            <div class="flex items-center justify-between px-4 py-3
               border-b border-gray-200/80 dark:border-white/5
               bg-slate-50/80 dark:bg-slate-900/80">
                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center justify-center h-8 w-8 rounded-lg
                   bg-violet-50 dark:bg-violet-500/15
                   text-violet-600 dark:text-violet-300
                   border border-violet-200 dark:border-violet-500/40">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                            <path
                                d="M12 22a2 2 0 0 0 2-2H10a2 2 0 0 0 2 2Zm7-6V11a7 7 0 0 0-14 0v5l-1.5 1.5a1 1 0 0 0 .7 1.7h16.6a1 1 0 0 0 .7-1.7Z"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <h2 class="text-sm font-semibold text-slate-900 dark:text-slate-100">
                        Bildirimler
                    </h2>
                </div>
                <button type="button" class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-slate-800"
                    (click)="closeNotifications()">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <!-- Liste -->
            <div class="flex-1 notifications-body no-scrollbar">
                <ng-container *ngIf="notifications.length > 0; else noNotifications">
                    <button type="button" *ngFor="let n of notifications" (click)="goToTicket(n.ticket.id)" class="w-full flex gap-3 px-4 py-3 border-b border-gray-100/80 dark:border-white/5
                   hover:bg-violet-50/70 dark:hover:bg-slate-800/60 text-left">
                        <div
                            class="h-8 w-8 rounded-lg bg-violet-500 text-white flex items-center justify-center text-[11px] font-semibold">
                            {{ n.actor?.name?.charAt(0) }}
                        </div>
                        <div class="flex-1 text-[13px]">
                            <div class="text-slate-900 dark:text-slate-100 font-medium">
                                {{ n.actor?.name }}
                                <span class="font-normal text-slate-700 dark:text-slate-300">
                                    {{ getActionText(n) }}
                                </span>
                            </div>
                            <div class="text-xs mt-0.5">
                                <span class="text-rose-500 font-semibold">
                                    {{ n.ticket.id }}
                                </span>
                            </div>
                            <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">
                                {{ n.createdDate | date: 'dd.MM.yyyy HH:mm:ss' }}
                            </div>
                        </div>
                    </button>

                    <button type="button" class="w-full px-4 py-2 flex items-center gap-2 text-[12px] font-medium
                   text-violet-600 dark:text-violet-300 hover:bg-violet-50/40 dark:hover:bg-slate-800/60"
                        (click)="openAllNotifications()">
                        <span class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></span>
                        <span> Tüm Bildirimler </span>
                        <span class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></span>
                    </button>
                </ng-container>

                <ng-template #noNotifications>
                    <div class="px-4 py-6 text-sm text-slate-500 dark:text-slate-400">
                        Henüz bildiriminiz yok.
                    </div>
                </ng-template>
            </div>

            <!-- Alt uyarı -->
            <div
                class="px-4 py-3 border-t border-gray-200/80 dark:border-white/5 text-[11px] text-slate-500 dark:text-slate-400">
                <span class="font-semibold">Uyarı:</span>
                Son 30 bildirim gösterilmektedir.
            </div>
        </section>
    </div>
</header>
