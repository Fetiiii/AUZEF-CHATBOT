<aside class="hidden lg:block">
    <div class="fixed left-0 top-0 h-full transition-[width] duration-300 ease-out sidebar-surface text-white shadow-xl"
        [ngClass]="collapsed ? 'w-20 sidebar-icon-only' : 'w-72'">

        <!-- Üst logo + başlık (GLOBAL İLE AYNI) -->
        <div class="sb-hero" [class.sb-hero-collapsed]="collapsed">
            <img src="assets/logo-auzef.png" alt="AUZEF" class="sb-hero-logo no-tint" />

            <div class="sb-hero-title sb-hero-title--boxes" *ngIf="!collapsed">
                <div class="sb-hero-box">{{ i18n.t('sidebar.brand') }} - {{ i18n.t('sidebar.login.chatbot') }}</div>
            </div>

        </div>



        <!-- MENÜ -->
        <nav class="p-2 text-sm overflow-y-auto no-scrollbar" [style.height]="'calc(100% - var(--header-h) - 170px)'">
            <div class="space-y-1">

                <!-- Veri Yönetimi -->
                <a routerLink="/chatbot/document-upload" routerLinkActive="active-sb" class="sidebar-item"
                    [class.justify-center]="collapsed" [class.px-0]="collapsed" [class.gap-0]="collapsed"
                    [attr.title]="collapsed ? i18n.t('nav.chatbot.document-upload') : null">
                    <span class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <path d="M3 9h18M3 15h18M9 9v9M15 9v9"/>
                        </svg>
                    </span>
                    <span class="min-w-0" *ngIf="!collapsed">
                        <div class="truncate font-medium">{{ i18n.t('nav.chatbot.document-upload') }}</div>
                    </span>
                </a>

                <!-- Akademik Takvim -->
                <a routerLink="/chatbot/academic-calendar" routerLinkActive="active-sb" class="sidebar-item"
                    [class.justify-center]="collapsed" [class.px-0]="collapsed" [class.gap-0]="collapsed"
                    [attr.title]="collapsed ? i18n.t('nav.chatbot.academic-calendar') : null">
                    <span class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <path d="M16 2v4M8 2v4M3 10h18"/>
                        </svg>
                    </span>
                    <span class="min-w-0" *ngIf="!collapsed">
                        <div class="truncate font-medium">{{ i18n.t('nav.chatbot.academic-calendar') }}</div>
                    </span>
                </a>

                <!-- Konuşmalar (en az admin) -->
                <a *ngIf="canSeeAdmin()" routerLink="/chatbot/conversations" routerLinkActive="active-sb" class="sidebar-item"
                    [class.justify-center]="collapsed" [class.px-0]="collapsed" [class.gap-0]="collapsed"
                    [attr.title]="collapsed ? i18n.t('nav.chatbot.conversations') : null">
                    <span class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <span class="min-w-0" *ngIf="!collapsed">
                        <div class="truncate font-medium">{{ i18n.t('nav.chatbot.conversations') }}</div>
                    </span>
                </a>

                <!-- İzleme Paneli (en az admin) -->
                <a *ngIf="canSeeAdmin()" routerLink="/chatbot/view-data" routerLinkActive="active-sb" class="sidebar-item"
                    [class.justify-center]="collapsed" [class.px-0]="collapsed" [class.gap-0]="collapsed"
                    [attr.title]="collapsed ? i18n.t('nav.chatbot.view-data') : null">
                    <span class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke-linecap="round" stroke-linejoin="round"></polyline>
                        </svg>
                    </span>
                    <span class="min-w-0" *ngIf="!collapsed">
                        <div class="truncate font-medium">
                            {{ i18n.t('nav.chatbot.view-data') }}
                        </div>
                    </span>
                </a>

                <!-- Ayarlar (yalnızca super admin) -->
                <a *ngIf="canSeeSuper()" routerLink="/chatbot/settings" routerLinkActive="active-sb" class="sidebar-item"
                    [class.justify-center]="collapsed" [class.px-0]="collapsed" [class.gap-0]="collapsed"
                    [attr.title]="collapsed ? i18n.t('nav.chatbot.settings') : null">
                    <span class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </span>
                    <span class="min-w-0" *ngIf="!collapsed">
                        <div class="truncate font-medium">{{ i18n.t('nav.chatbot.settings') }}</div>
                    </span>
                </a>

            </div>
        </nav>

    </div>
</aside>
